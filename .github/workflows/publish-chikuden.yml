# chikuden-hojokin.jp を一度だけ公開するための、暫定のワークフロー。
#
# サイト本体は syunnjack/my-affiliate-site にあるが、そちらのリポジトリには
# まだ Xserver 接続用のシークレットが登録されていない。ドメインの DNS は
# 既に Xserver を向いていて public_html が空なだけなので、SSH が通る
# こちらのリポジトリから一度だけ配信して公開状態にする。
#
# my-affiliate-site に SSH_HOST / SSH_USERNAME / SSH_PRIVATE_KEY を登録したら、
# 向こうの deploy.yml が使えるようになるので、このファイルは削除する。
#
# 手動実行のみ。消す操作はしない。
name: Publish chikuden-hojokin (one-off)

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site repository
        uses: actions/checkout@v4
        with:
          repository: syunnjack/my-affiliate-site
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build (static export)
        run: npm run build

      - name: Show what will be uploaded
        run: |
          echo "HTMLファイル数: $(find ./out -name '*.html' | wc -l)"
          ls ./out | head

      - name: Upload to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './out/*'
          remote_path: '/home/xs501620/chikuden-hojokin.jp/public_html/'
          sftp_only: true
          delete_remote_files: false
