# 本番で不動産価格が取得できない原因を切り分けるためだけの、一時的なワークフロー。
# 手動実行のみ。値そのものは出さず、設定されているかどうかだけを見る。
# 確認が済んだら削除する。
name: Inspect config

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check env and logs over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            APP=~/fudousan-watch.jp/app
            echo "=== .env に MLIT のキーがあるか（値は出さない） ==="
            if grep -q '^MLIT_REINFOLIB_API_KEY=.\+' "$APP/.env" 2>/dev/null; then
              echo "  設定あり（長さ $(grep '^MLIT_REINFOLIB_API_KEY=' "$APP/.env" | cut -d= -f2 | tr -d '\r\n' | wc -c) 文字）"
            elif grep -q '^MLIT_REINFOLIB_API_KEY=' "$APP/.env" 2>/dev/null; then
              echo "  行はあるが空"
            else
              echo "  行が無い"
            fi
            echo
            echo "=== config キャッシュの有無 ==="
            ls -la "$APP/bootstrap/cache/config.php" 2>&1 | tail -1
            echo
            echo "=== 直近のログ（MLIT関連） ==="
            grep -o 'MLIT[^"]*' "$APP/storage/logs/laravel.log" 2>/dev/null | tail -5
            echo
            echo "=== 外部APIへ出られるか ==="
            curl -s -o /dev/null -w "  reinfolib への疎通: %{http_code}\n" --max-time 20 https://www.reinfolib.mlit.go.jp/ex-api/external/XIT001
