# 楽天APIを使うサイトについて、必要な3つの値が「設定あり/空/行なし」の
# どれなのかを確認する。手動実行のみ、読み取り専用。値は出力しない。
name: Inspect all env

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Scan .env files over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            for domain in camp-hikaku.jp kaden-hikaku.jp furusato-hikaku.net golf-search.org kuruma-kaitori.shop; do
              env=~/$domain/app/.env
              [ -f "$env" ] || { echo "[$domain] .env なし"; continue; }
              out=""
              for k in RAKUTEN_APP_ID RAKUTEN_ACCESS_KEY RAKUTEN_AFFILIATE_ID; do
                line=$(grep "^${k}=" "$env" 2>/dev/null | head -1)
                if [ -z "$line" ]; then
                  out="$out ${k}=行なし"
                else
                  val=$(printf '%s' "$line" | cut -d= -f2- | tr -d '\r\n" ')
                  [ -n "$val" ] && out="$out ${k}=設定あり" || out="$out ${k}=空"
                fi
              done
              echo "[$domain]$out"
            done
