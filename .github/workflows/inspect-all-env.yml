# kaden-hikaku の検索が0件になる原因を確認する。手動実行のみ、読み取り専用。
name: Inspect all env

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check kaden-hikaku over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            cd ~/kaden-hikaku.jp/app
            PHP=$(command -v php8.3 || command -v php)
            echo "=== 楽天APIを直接叩いた結果（値は出さない） ==="
            $PHP -r '
              $env = parse_ini_file(__DIR__."/.env");
              $q = http_build_query([
                "format" => "json", "formatVersion" => 2,
                "applicationId" => $env["RAKUTEN_APP_ID"] ?? "",
                "accessKey" => $env["RAKUTEN_ACCESS_KEY"] ?? "",
                "affiliateId" => $env["RAKUTEN_AFFILIATE_ID"] ?? "",
                "keyword" => "冷蔵庫", "hits" => 3,
              ]);
              $url = "https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701?".$q;
              $ch = curl_init($url);
              curl_setopt_array($ch, [CURLOPT_RETURNTRANSFER => true, CURLOPT_TIMEOUT => 20, CURLOPT_ENCODING => ""]);
              $body = curl_exec($ch);
              $code = curl_getinfo($ch, CURLINFO_HTTP_CODE);
              echo "  HTTP ".$code."\n";
              $j = json_decode($body, true);
              if (isset($j["Items"])) { echo "  取得件数: ".count($j["Items"])."\n"; }
              else { echo "  応答: ".substr(preg_replace("/\s+/", " ", $body), 0, 200)."\n"; }
            '
            echo
            echo "=== 直近の例外 ==="
            grep -o 'production\.ERROR: [^{]*' storage/logs/laravel.log 2>/dev/null | tail -3
