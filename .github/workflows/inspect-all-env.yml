# サーバ上の全アプリについて、.env の「空になっている変数」を横断で洗い出す。
# 手動実行のみ、読み取り専用。値は一切出力せず、変数名だけを出す。確認後に削除する。
name: Inspect all env

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Scan .env files over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            # 無くても表示が壊れないもの（メール・Slack・AWS・計測）は除外して見やすくする
            IGNORE='^(MAIL_|POSTMARK|RESEND|SLACK_|AWS_|MEMCACHED|REDIS|PUSHER|VITE_|GA4_|GA_|GOOGLE_SITE_VERIFICATION|GOOGLE_SEARCH_CONSOLE|APP_DEBUG|APP_MAINTENANCE|DB_|SESSION_|CACHE_|QUEUE_|BROADCAST_|FILESYSTEM_|LOG_|PHP_CLI)'

            for env in ~/*/app/.env; do
              [ -f "$env" ] || continue
              dir=$(dirname "$env")
              [ -f "$dir/artisan" ] || continue
              domain=$(echo "$dir" | sed 's|.*/\([^/]*\)/app$|\1|')

              empties=$(grep -E '^[A-Z][A-Z0-9_]*=[[:space:]]*$' "$env" 2>/dev/null \
                        | cut -d= -f1 \
                        | grep -Ev "$IGNORE" \
                        | tr '\n' ' ')

              if [ -n "$empties" ]; then
                echo "[$domain] 空: $empties"
              else
                echo "[$domain] 空の項目なし"
              fi
            done
