# 平文の認証情報が入った不要な雛形ファイルを片付ける。手動実行のみ。
#
# umikaido.jp の umikaido-app/.env.production.template に、DBとメールの
# パスワードが平文で入っていた。Webからは到達できないが、本番の .env に
# 同じ値が入っており重複しているだけなので消す。
#
# 消す前に、.env 側に必要なキーが揃っていることを確かめる。
# あわせて、他サイトにも同種のファイルが無いかを調べる（名前だけ報告し、値は出さない）。
name: Cleanup credential templates

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and remove over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            APP=~/umikaido.jp/umikaido-app
            T="$APP/.env.production.template"

            echo "=== 本番 .env に必要なキーが入っているか（値は出さない） ==="
            missing=0
            for k in APP_KEY DB_DATABASE DB_USERNAME DB_PASSWORD MAIL_USERNAME MAIL_PASSWORD; do
              v=$(grep "^${k}=" "$APP/.env" 2>/dev/null | cut -d= -f2- | tr -d '\r\n" ')
              if [ -n "$v" ]; then
                echo "  $k=設定あり"
              else
                echo "  $k=空または行なし"
                missing=$((missing+1))
              fi
            done

            if [ ! -f "$T" ]; then
              echo "雛形ファイルは既にありません。"
            elif [ "$missing" -gt 0 ]; then
              echo "本番 .env に不足があるため、雛形は消さずに残します。"
            else
              rm -f "$T"
              echo "雛形ファイルを削除しました: $T"
            fi

            echo
            echo "=== 他サイトに同種のファイルが無いか（ファイル名のみ） ==="
            find ~ -maxdepth 4 \( -name '.env.*template*' -o -name '.env.production*' -o -name '.env.bak*' -o -name '.env.save' \) 2>/dev/null | sed "s|$HOME|~|" | head -20
            echo
            echo "=== .env.example に実値が入っていないか（該当ファイル名のみ） ==="
            for f in $(find ~ -maxdepth 4 -name '.env.example' 2>/dev/null); do
              if grep -qE '^(DB_PASSWORD|MAIL_PASSWORD)=.+' "$f" 2>/dev/null; then
                echo "  値が入っている: $(echo "$f" | sed "s|$HOME|~|")"
              fi
            done
