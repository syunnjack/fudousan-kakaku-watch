# .env のバックアップとして残ったファイルを片付ける。手動実行のみ。
#
# 今日 sync-env / sync-line-env を流した際に、各サイトの .env のバックアップを
# 取っている。中身は認証情報を含む .env そのものなので、役目を終えたら残さない。
#
# 消す前に、対応する .env が読める状態にあることを確かめる。
# 念のため、各サイトにつき最新の1つだけは残す。
name: Cleanup env backups

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove stale .env backups over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            removed=0
            kept=0

            # .env.bak.* を持つディレクトリごとに処理する
            for dir in $(find ~ -maxdepth 4 -name '.env.bak.*' 2>/dev/null | xargs -r -n1 dirname | sort -u); do
              if [ ! -s "$dir/.env" ]; then
                echo "  $(echo "$dir" | sed "s|$HOME|~|"): .env が読めないため触りません"
                continue
              fi

              # 新しい順に並べ、最新1つを残して消す
              n=0
              for f in $(ls -t "$dir"/.env.bak.* 2>/dev/null); do
                n=$((n+1))
                if [ "$n" -eq 1 ]; then
                  kept=$((kept+1))
                else
                  rm -f "$f"
                  removed=$((removed+1))
                fi
              done
              echo "  $(echo "$dir" | sed "s|$HOME|~|"): $((n-1))件削除 / 1件保持"
            done

            echo
            echo "合計 ${removed}件を削除、${kept}ディレクトリで最新1件を保持しました。"
            echo
            echo "=== 残っているバックアップ ==="
            find ~ -maxdepth 4 -name '.env.bak.*' 2>/dev/null | sed "s|$HOME|~|" | head -20
