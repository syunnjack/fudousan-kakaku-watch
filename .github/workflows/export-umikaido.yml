# umikaido.jp のアプリをサーバから取り出して、成果物として持ち帰るための一時ワークフロー。
#
# このサイトはGitHubにソースが無く、サーバ上のファイルが唯一の実体になっている。
# バージョン管理下に置くため、いったん手元に吸い上げる。
#
# 手動実行のみ。サーバ側は読むだけで、変更も削除もしない。
# 認証情報を含む .env と、復元できる vendor / storage は持ち出さない。
name: Export umikaido

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Collect the app over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            APP=~/umikaido.jp/umikaido-app
            cd "$APP"

            echo "=== PHPの状況 ==="
            echo "  CLI: $(php -v 2>&1 | head -1)"
            ls /opt/ 2>/dev/null | grep -i php | head -5
            echo "  .user.ini の指定:"; grep -iE "php|version" ~/umikaido.jp/public_html/.user.ini 2>/dev/null | head -3

            echo
            echo "=== 構成 ==="
            ls
            echo "  package.json: $([ -f package.json ] && echo あり || echo なし)"
            echo "  vite.config: $(ls vite.config.* 2>/dev/null || echo なし)"
            echo "  public/build: $(ls public/build 2>/dev/null | head -3 | tr '\n' ' ')"

            echo
            echo "=== まとめる ==="
            rm -f ~/umikaido-export.tar.gz
            tar czf ~/umikaido-export.tar.gz \
              --exclude='./vendor' \
              --exclude='./node_modules' \
              --exclude='./storage/framework/views/*' \
              --exclude='./storage/framework/cache/*' \
              --exclude='./storage/framework/sessions/*' \
              --exclude='./storage/logs/*' \
              --exclude='./.env' \
              --exclude='./.git' \
              -C "$APP" .
            ls -la ~/umikaido-export.tar.gz

      - name: Download the archive
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 10022 "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/deploy_key -P 10022 \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/umikaido-export.tar.gz" ./umikaido-export.tar.gz
          rm -f ~/.ssh/deploy_key
          ls -la umikaido-export.tar.gz

      - name: Remove the archive from the server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: rm -f ~/umikaido-export.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: umikaido-app
          path: umikaido-export.tar.gz
          retention-days: 1
