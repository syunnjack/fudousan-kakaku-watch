# umikaido.jp の PHP 構成を確認するための一時ワークフロー。手動実行のみ・読み取り専用。
name: Export umikaido

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check PHP versions over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== 既定の php ==="
            php -v 2>&1 | head -1
            echo
            echo "=== /opt にある 8.x ==="
            ls -d /opt/php-8* 2>/dev/null
            echo
            echo "=== 8.4系で artisan が通るか ==="
            P=$(ls -d /opt/php-8.4* 2>/dev/null | tail -1)
            if [ -n "$P" ] && [ -x "$P/bin/php" ]; then
              echo "  使うPHP: $($P/bin/php -v | head -1)"
              cd ~/umikaido.jp/umikaido-app
              $P/bin/php artisan --version 2>&1 | head -3
            else
              echo "  8.4系が /opt に見つかりません"
            fi
            echo
            echo "=== Webが使っているPHP（public_html/.htaccess の指定） ==="
            grep -iE "php|handler|AddHandler|suPHP" ~/umikaido.jp/public_html/.htaccess 2>/dev/null | head -5
