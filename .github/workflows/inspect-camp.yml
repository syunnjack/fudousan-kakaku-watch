# camp-hikaku.jp のトップが500になる原因を調べる一時ワークフロー。手動実行のみ・読み取り専用。
name: Inspect camp-hikaku

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read the log over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            APP=~/camp-hikaku.jp/app
            echo "=== 直近の例外（日時つき・値は出さない） ==="
            grep -o '^\[[^]]*\] production\.ERROR: [^{]*' "$APP/storage/logs/laravel.log" 2>/dev/null | tail -6
            echo
            echo "=== .env の行数と壊れた行が無いか ==="
            wc -l < "$APP/.env"
            grep -nvE '^[A-Z][A-Z0-9_]*=|^#|^$' "$APP/.env" | head -5
            echo
            echo "=== LINE関連の行（値は出さない） ==="
            grep -nE '^LINE_' "$APP/.env" | cut -d= -f1
            echo
            echo "=== 今日触ったビューの更新時刻 ==="
            ls -la "$APP/resources/views/spots/"*.blade.php 2>/dev/null | head -5
