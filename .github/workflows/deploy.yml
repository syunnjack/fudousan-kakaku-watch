name: Deploy to Xserver

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './public/*'
          remote_path: '/home/xs501620/fudousan-watch.jp/public_html/'
          sftp_only: true
          delete_remote_files: false

      # public/ しか送っていなかったため、blade を直しても本番に届かなかった。
      # 都道府県ごとに正しい canonical を出す修正（11bacaf）も、コミットされた
      # まま反映されず、47ページすべてが /search を正規URLとして申告していた。
      #
      # サーバ上では public_html が app/public へのシンボリックリンクで、
      # Laravel 本体は <ドメイン>/app/ に置かれている。
      #   ~/fudousan-watch.jp/app/            リポジトリのルート相当
      #   ~/fudousan-watch.jp/public_html  -> app/public
      #
      # 消す操作は一切しない。views の更新だけを届ける。
      #
      # 注意: app/ routes/ config/ は対象外なので、コントローラやルートを
      # 変えたときは別途デプロイが要る。
      - name: Deploy views to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './resources/*'
          remote_path: '/home/xs501620/fudousan-watch.jp/app/resources/'
          sftp_only: true
          delete_remote_files: false

      # 取得結果のキャッシュなど、アプリ側の処理も本番に届いていなかった。
      # routes/ config/ は変更していないので対象外のまま。
      - name: Deploy app code to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './app/*'
          remote_path: '/home/xs501620/fudousan-watch.jp/app/app/'
          sftp_only: true
          delete_remote_files: false
