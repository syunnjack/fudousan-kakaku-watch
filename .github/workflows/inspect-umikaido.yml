# umikaido.jp の構成を調べるためだけの一時ワークフロー。手動実行のみ・読み取り専用。
name: Inspect umikaido

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Look up the site over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            APP=~/umikaido.jp/umikaido-app
            echo "=== アプリのルート ==="
            ls "$APP" 2>&1 | head -20
            echo
            echo "=== public_html は何か ==="
            ls -la ~/umikaido.jp/public_html 2>&1 | head -6
            echo
            echo "=== composer.json の name ==="
            grep -m1 '"name"' "$APP/composer.json" 2>&1
            echo
            echo "=== JSON-LD を出している blade ==="
            grep -rl "application/ld+json" "$APP/resources/views" 2>/dev/null | sed "s|$APP/||"
            echo
            echo "=== '@context' の書き方（エスケープの有無） ==="
            grep -rn "@context" "$APP/resources/views" 2>/dev/null | sed "s|$APP/||" | head -20
