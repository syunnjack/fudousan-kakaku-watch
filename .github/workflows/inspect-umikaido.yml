# umikaido.jp の JSON-LD が壊れているのを直す。手動実行のみ。
#
# layouts/app.blade.php の既定値で '@context' がそのまま書かれており、
# Blade の @context ディレクティブとして展開されてキーがPHPコード片に
# なっていた。各ページで $jsonLd を @php ブロック内で組んでいるページは
# 無事だが、既定値に落ちる5ページ（/routes /tokaido /nostalgia /community
# /search）が壊れていた。
#
# 他サイトと同じく @@ でエスケープする。書き換え前にバックアップを取る。
name: Fix umikaido json-ld

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Patch the layout over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 10022
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            APP=~/umikaido.jp/umikaido-app
            F="$APP/resources/views/layouts/app.blade.php"

            [ -f "$F" ] || { echo "$F がありません"; exit 1; }

            echo "=== 修正前 ==="
            grep -n "'@context'" "$F" | head -3

            cp "$F" "$F.bak.$(date +%Y%m%d%H%M%S)"

            # 既定値の '@context' だけを '@@context' に変える。
            # 既に @@ になっているものは触らない。
            sed -i "s/'@context' => 'https:\/\/schema.org'/'@@context' => 'https:\/\/schema.org'/g" "$F"

            echo "=== 修正後 ==="
            grep -n "@context" "$F" | head -3

            PHP=$(command -v php8.3 || command -v php || echo /opt/php-8.3.30/bin/php)
            cd "$APP"
            $PHP artisan view:clear
            echo "ビューキャッシュを消しました"
